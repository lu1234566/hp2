name: Probe HP2 animation source

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/hp2-g5d-skeletal-probe"
      - "agent/hp2-g5d-pose-skinning"
    paths:
      - ".github/workflows/probe-animation-source.yml"
      - "scripts/probe-animation-source.sh"
      - "tools/hp2_animation*.cpp"
      - "src/portcore/**"

permissions:
  contents: read

jobs:
  animation-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HP2_DRIVE_URL: ${{ secrets.HP2_DRIVE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Check private media configuration
        run: |
          if [[ -z "$HP2_DRIVE_URL" ]]; then
            echo "HP2_DRIVE_URL is not configured as a repository secret." >&2
            exit 64
          fi
      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iat libarchive-tools p7zip-full unshield
          python3 -m pip install --disable-pip-version-check gdown==5.2.0
      - name: Probe linked Animation export
        run: bash scripts/probe-animation-source.sh .local/hp2-animation-report
      - name: Upload metadata-only animation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HP2-animation-source-report
          path: .local/hp2-animation-report
          if-no-files-found: warn
          retention-days: 7
